<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">LexiLoop daily vocabulary dashboard</title><desc id="desc">Dashboard with a daily learning path, progress indicators, and word in focus panel.</desc>
  <rect width="1440" height="900" fill="#f4f1eb"/>
  <g font-family="Arial, sans-serif" fill="#172329"><text x="130" y="85" font-size="29" font-weight="700">● LexiLoop</text><text x="1100" y="82" font-size="15">✦ 7 day streak</text><circle cx="1275" cy="76" r="22" fill="#d3c5ec"/><text x="1262" y="81" font-size="11">AR</text>
  <text x="130" y="180" font-size="12" fill="#6b7474" letter-spacing="2">TUESDAY, OCTOBER 6</text><text x="130" y="260" font-family="Georgia, serif" font-size="72">Words worth</text><text x="130" y="334" font-family="Georgia, serif" font-size="72" fill="#ce6d58" font-style="italic">keeping.</text><text x="130" y="380" font-size="19" fill="#6b7474">Build a vocabulary that sticks through short, thoughtful</text><text x="130" y="407" font-size="19" fill="#6b7474">recall sessions.</text>
  <rect x="930" y="150" width="380" height="190" rx="4" fill="#b7d7e2"/><circle cx="1017" cy="245" r="45" fill="none" stroke="#172329" stroke-width="8"/><text x="1007" y="248" font-size="25">3</text><text x="1005" y="265" font-size="10">of 5</text><text x="1095" y="207" font-size="11" fill="#6b7474" letter-spacing="2">TODAY'S FOCUS</text><text x="1095" y="245" font-family="Georgia, serif" font-size="25">Making meaning</text><text x="1095" y="275" font-family="Georgia, serif" font-size="25">memorable</text><text x="1095" y="310" font-size="13" font-weight="700">Continue learning →</text>
  <line x1="130" y1="470" x2="1310" y2="470" stroke="#d9dbd4"/><line x1="130" y1="590" x2="1310" y2="590" stroke="#d9dbd4"/><g font-size="13" fill="#6b7474"><text x="160" y="555">words learned</text><text x="410" y="555">recall accuracy</text><text x="670" y="555">day streak</text></g><g font-family="Georgia, serif" font-size="40"><text x="160" y="530">42</text><text x="410" y="530">86%</text><text x="670" y="530">7</text></g><text x="935" y="505" font-size="11" fill="#6b7474" letter-spacing="2">THIS WEEK</text><g fill="#172329"><rect x="935" y="535" width="16" height="32" rx="8"/><rect x="965" y="535" width="16" height="32" rx="8"/><rect x="995" y="535" width="16" height="32" rx="8"/></g><rect x="1025" y="552" width="16" height="15" rx="8" fill="#b7d7e2"/>
  <text x="130" y="665" font-size="11" fill="#6b7474" letter-spacing="2">DAILY PATH</text><text x="130" y="710" font-family="Georgia, serif" font-size="32">Learn in context</text><g font-size="18"><text x="150" y="770" fill="#6b7474">01</text><text x="215" y="770" font-family="Georgia, serif" font-size="25">lucid</text><text x="520" y="770" fill="#6b7474">adjective</text><text x="650" y="770" fill="#55775d">✓</text><text x="150" y="825" fill="#6b7474">02</text><text x="215" y="825" font-family="Georgia, serif" font-size="25">sonder</text><text x="520" y="825" fill="#6b7474">noun</text><text x="650" y="825" fill="#55775d">✓</text></g>
  <rect x="790" y="630" width="520" height="235" fill="#fffdf9" stroke="#e8e5dd"/><text x="825" y="670" font-size="11" fill="#6b7474" letter-spacing="2">WORD IN FOCUS</text><text x="825" y="720" font-family="Georgia, serif" font-size="42">tenacious</text><text x="825" y="747" font-size="12" fill="#6b7474">/təˈneɪʃəs/ · adjective</text><text x="825" y="790" font-family="Georgia, serif" font-size="18">Persistent and determined.</text><text x="825" y="828" font-size="12" fill="#6b7474">“She was tenacious in her pursuit of a solution.”</text></g>
</svg>
