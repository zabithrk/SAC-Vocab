<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">LexiLoop active recall practice</title><desc id="desc">A vocabulary recall question asking which word means short-lived, with the correct answer selected.</desc>
  <rect width="1440" height="620" fill="#f4f1eb"/><rect x="0" y="0" width="1440" height="620" fill="#172329" opacity=".55"/><rect x="420" y="65" width="600" height="490" fill="#fffdf9"/>
  <text x="470" y="128" font-family="Arial, sans-serif" font-size="12" fill="#6b7474" letter-spacing="2">TWO-MINUTE RECALL · 1 OF 3</text><text x="470" y="210" font-family="Georgia, serif" font-size="43" fill="#172329">Which word means</text><text x="470" y="260" font-family="Georgia, serif" font-size="43" fill="#172329">“short-lived”?</text><text x="970" y="105" font-family="Arial, sans-serif" font-size="28" fill="#172329">×</text>
  <rect x="470" y="305" width="500" height="52" fill="#fff" stroke="#d9dbd4"/><text x="492" y="338" font-family="Georgia, serif" font-size="20" fill="#172329">equanimity</text><rect x="470" y="370" width="500" height="52" fill="#dff0b0" stroke="#7b9d35"/><text x="492" y="403" font-family="Georgia, serif" font-size="20" fill="#172329">ephemeral</text><text x="935" y="403" font-family="Arial, sans-serif" font-size="18" fill="#55775d">✓</text><rect x="470" y="435" width="500" height="52" fill="#fff" stroke="#d9dbd4"/><text x="492" y="468" font-family="Georgia, serif" font-size="20" fill="#172329">tenacious</text><text x="470" y="525" font-family="Arial, sans-serif" font-size="14" fill="#6b7474">Exactly — ephemeral describes something fleeting.</text>
</svg>
